name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (FastAPI + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: agri, POSTGRES_PASSWORD: agri, POSTGRES_DB: agri_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agri" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run: { working-directory: backend }
    env:
      DATABASE_URL: postgresql+psycopg://agri:agri@localhost:5432/agri_test
      TEST_DATABASE_URL: postgresql+psycopg://agri:agri@localhost:5432/agri_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Migrations apply cleanly and match the models
        run: alembic upgrade head && alembic check
      - name: Tests (against PostgreSQL)
        run: pytest -q

  ml:
    name: ML pipeline (scikit-learn, XGBoost, PyTorch, MLflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ml/requirements.txt }
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r ml/requirements.txt
      - run: pytest -q ml/tests
      - name: Train on the real dataset (smoke run)
        run: |
          python -m ml.data.download_dataset
          python -m ml.train --cv-folds 3
          python -m ml.explain
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: |
            ml/models/crop_model.joblib
            ml/models/metrics.json
            ml/reports/

  farm-service:
    name: Farm service (Node + MongoDB)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
    defaults:
      run: { working-directory: services/farm-service }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: services/farm-service/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend/web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test # Vitest
      - run: npm run test:jest
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/web/playwright-report }

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, farm-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build all images
        run: |
          docker build -f backend/Dockerfile --target api -t agri-api .
          docker build services/farm-service -t agri-farm-service
          docker build frontend/web -t agri-web
