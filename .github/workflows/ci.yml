name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (FastAPI + AIML serving + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: agri, POSTGRES_PASSWORD: agri, POSTGRES_DB: agri_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agri" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run: { working-directory: backend/python-fastapi }
    env:
      DATABASE_URL: postgresql+psycopg://agri:agri@localhost:5432/agri_test
      TEST_DATABASE_URL: postgresql+psycopg://agri:agri@localhost:5432/agri_test
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/python-fastapi/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Migrations apply cleanly and match the models
        run: alembic upgrade head && alembic check
      - name: Tests (against PostgreSQL)
        run: pytest -q

  aiml:
    name: AIML (models, RAG, agents, MCP server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            AIML/requirements.txt
            backend/python-fastapi/requirements.txt
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r AIML/requirements.txt -r backend/python-fastapi/requirements.txt
      - run: pytest -q AIML/tests
      - name: MCP server answers over stateless HTTP
        run: |
          python -m AIML.agentic_ai.mcp_server --transport http --port 8100 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8100/health && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:8100/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q explain_crop

  farm-service:
    name: Farm service (Node + MongoDB)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
    defaults:
      run: { working-directory: backend/node-express }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: backend/node-express/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test

  dashboard:
    name: Dashboard (React + Tailwind)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: Dashboard }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: Dashboard/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  react-app:
    name: React app (Vite + JSX)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend/react-app }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/react-app/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:fast # oxlint
      - run: npm test # Vitest
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e # builds, previews and runs Playwright
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: react-playwright-report, path: frontend/react-app/playwright-report }

  format:
    name: Formatting (Prettier + Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npx prettier --check .
      - run: pip install "ruff>=0.8" && ruff format --check main.py backend/python-fastapi AIML scripts

  gateway:
    name: Gateway config + Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose file is valid
        run: docker compose config --quiet
      - name: nginx accepts the gateway config
        run: |
          docker run --rm \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/infra/nginx/agrismart-routes.inc:/etc/nginx/snippets/agrismart-routes.inc:ro" \
            nginx:1.28-alpine nginx -t

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, aiml, farm-service, dashboard, react-app, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build all images
        run: |
          docker build -f backend/python-fastapi/Dockerfile -t agrismart-api .
          docker build backend/node-express -t agrismart-farm-service
          docker build frontend/react-app -t agrismart-react-web
          docker build Dashboard -t agrismart-dashboard
