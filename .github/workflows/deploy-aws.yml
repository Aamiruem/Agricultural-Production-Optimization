# Build images, push to Amazon ECR and roll out the ECS services created by
# infra/aws/terraform. Runs manually, or on pushes to main once the repository
# variable AWS_DEPLOY_ROLE_ARN is set (GitHub OIDC — no long-lived AWS keys).
name: Deploy to AWS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write # OIDC token for aws-actions/configure-aws-credentials
  contents: read

concurrency: deploy-production

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  PROJECT: ${{ vars.PROJECT_NAME || 'agrioptima' }}

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          build_push() { # name, docker build args...
            local name=$1; shift
            docker build "$@" -t "$REGISTRY/$PROJECT-$name:$TAG" -t "$REGISTRY/$PROJECT-$name:latest"
            docker push --all-tags "$REGISTRY/$PROJECT-$name"
          }
          build_push api -f backend/python-fastapi/Dockerfile --target api .
          build_push worker -f backend/python-fastapi/Dockerfile --target worker .
          build_push farm-service backend/node-express
          build_push web frontend/react-app --build-arg VITE_SITE_URL="$SITE_URL"

      - name: Roll out ECS services
        run: |
          for svc in api worker farm-service web; do
            aws ecs update-service --cluster "$PROJECT" --service "$PROJECT-$svc" --force-new-deployment >/dev/null
          done
          aws ecs wait services-stable --cluster "$PROJECT" \
            --services "$PROJECT-api" "$PROJECT-worker" "$PROJECT-farm-service" "$PROJECT-web"
