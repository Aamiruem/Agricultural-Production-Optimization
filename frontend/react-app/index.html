<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Crop and fertilizer recommendations, farm management and an AI farm assistant for Indian agriculture." />
    <meta name="keywords" content="India crop recommendation, soil health, farm planning, fertilizer advice, agriculture dashboard, Indian crops" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AgriSmart — Precision farming for India" />
    <meta property="og:description" content="Explore crop recommendations, soil planning and farm insights for Indian agriculture." />
    <meta property="og:image" content="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#2e7d32" />
    <title>AgriSmart — Indian crop and farm planning</title>
    <script>
      // Apply the saved/system colour mode before first paint (no flash).
      (function () {
        try {
          var saved = localStorage.getItem("agri-theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>AgriSmart needs JavaScript enabled.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
