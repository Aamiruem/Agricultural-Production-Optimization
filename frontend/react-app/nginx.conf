# Static hosting for the React build. API routing lives in ONE place: the gateway
# (infra/nginx, Docker) or the AWS load balancer — so this container starts without
# any backend and runs anywhere (Docker, ECS, a plain VM).
server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Hashed build assets never change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Photos and artwork (also used by the Dashboard through the gateway).
  location /images/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # index.html is revalidated so new deploys show up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }

  # Old/alias URLs (kept in sync with vercel.json and REDIRECTS in src/seo/routes.js).
  location = /recommend { return 301 /crop-recommendation; }
  location = /yield { return 301 /yield-prediction; }
  location = /soil { return 301 /soil-analysis; }
  location = /irrigation { return 301 /irrigation-optimization; }
  location = /disease { return 301 /disease-detection; }
  location = /agriculture { return 301 /agricultural-production-systems; }
  location = /machines { return 301 /smart-agricultural-machines; }
  location = /ai-solutions { return 301 /ai-in-agriculture; }
  location = /healthcare { return 301 /farmer-health; }
  location = /nutrition { return 301 /food-and-nutrition; }
  location ~ ^/(login|register|admin)$ { return 301 /; }

  # Every route has its own prerendered HTML (dist/<route>.html) with the right
  # title, description, canonical and JSON-LD. Unknown paths get a real 404.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri.html $uri/ =404;
  }
  error_page 404 /404.html;
}
