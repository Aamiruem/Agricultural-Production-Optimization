# Static hosting for the React build. API routing lives in ONE place: the gateway
# (infra/nginx, Docker) or the AWS load balancer — so this container starts without
# any backend and runs anywhere (Docker, ECS, a plain VM).
server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Hashed build assets never change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Photos and artwork (also used by the Dashboard through the gateway).
  location /images/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # index.html is revalidated so new deploys show up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }

  # Client-side routing: unknown paths load the SPA.
  location / {
    try_files $uri /index.html;
  }
}
