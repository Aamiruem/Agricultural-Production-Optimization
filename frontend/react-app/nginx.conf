# Serves the React build and proxies the APIs under the same origin
# (mirrors the Vite dev-server proxy in vite.config.js).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 2m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # FastAPI: REST, Server-Sent Events (assistant) and WebSockets (live what-if)
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # Node farm-service (mounted at /farm-api) and its Socket.IO endpoint
  location /farm-api/ {
    proxy_pass http://farm-service:4100;
  }
  location /socket.io/ {
    proxy_pass http://farm-service:4100;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routing: unknown paths load index.html.
  location / {
    try_files $uri /index.html;
  }
}
