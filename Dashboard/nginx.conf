# Static hosting for the dashboard build. API routes are handled by the gateway
# in front of this container (infra/nginx/agrismart-routes.inc).
server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # index.html must always be revalidated so new deploys are picked up.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }

  # Client-side routing: unknown paths load the SPA.
  location / {
    try_files $uri /index.html;
  }
}
