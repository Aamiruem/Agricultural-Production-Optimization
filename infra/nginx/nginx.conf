# Reverse proxy: one origin (http://localhost) for the whole stack.
#   /            -> Next.js web app
#   /api/        -> FastAPI (ML, auth, assistant SSE, WebSockets)
#   /farm-api/   -> Node farm-service (/api)
#   /socket.io/  -> Node farm-service (Socket.IO)

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

upstream web          { server web:3000; }
upstream api          { server api:8000; }
upstream farm_service { server farm-service:4100; }

server {
  listen 80;
  server_name _;
  client_max_body_size 2m;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Assistant: Server-Sent Events must not be buffered.
  location /api/assistant/chat {
    proxy_pass http://api;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  # FastAPI WebSockets (live recommendations)
  location /api/ws/ {
    proxy_pass http://api;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://api;
  }

  location /farm-api/ {
    proxy_pass http://farm_service/api/;
  }

  location /socket.io/ {
    proxy_pass http://farm_service;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass http://web;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

