# AgriSmart gateway: reverse proxy + load balancer for the whole stack.
# Mounted by docker-compose.yml as /etc/nginx/conf.d/default.conf (http context),
# with the shared routes in agrismart-routes.inc.
#
#   :8080  React web app      (frontend/react-app)
#   :8090  Operations dashboard (Dashboard/)
#   both   /api/  /docs        -> FastAPI replicas         (least connections)
#          /farm-api/          -> Express replicas         (least connections)
#          /socket.io/         -> Express replicas         (sticky by client IP)
#          /mcp                -> MCP server replicas      (stateless, least connections)
#
# Load handling
#   * Replicas are discovered through Docker DNS and re-resolved every 10 s
#     (`resolve`), so `docker compose up --scale api=5` is picked up without a reload.
#   * Passive health checks: a replica failing 3 times is skipped for 10 s.
#   * Idempotent requests are retried on another replica on connect errors/timeouts.
#   * Per-IP rate limits (429) and connection caps protect the services.
#   * Public read-only API responses are micro-cached and served stale if every
#     replica is down or overloaded.
#   * With no healthy upstream the client gets JSON 503 + Retry-After, not an HTML 502.

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      "";      # empty Connection header keeps upstream keep-alive working
}

limit_req_zone  $binary_remote_addr zone=api_rl:20m rate=50r/s;
limit_req_zone  $binary_remote_addr zone=ai_rl:10m  rate=5r/s;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;
limit_req_status  429;
limit_conn_status 429;

proxy_cache_path /var/cache/nginx/agrismart levels=1:2 keys_zone=api_cache:10m max_size=256m
                 inactive=10m use_temp_path=off;

upstream api_pool {
  zone api_pool 128k;
  least_conn;
  server api:8000 resolve max_fails=3 fail_timeout=10s;
  keepalive 64;
}

upstream farm_pool {
  zone farm_pool 64k;
  least_conn;
  server farm-service:4100 resolve max_fails=3 fail_timeout=10s;
  keepalive 32;
}

upstream socket_pool {
  zone socket_pool 64k;
  hash $binary_remote_addr consistent;  # Socket.IO long-polling needs every request on one replica
  server farm-service:4100 resolve max_fails=3 fail_timeout=10s;
}

upstream mcp_pool {
  zone mcp_pool 64k;
  least_conn;
  server mcp:8100 resolve max_fails=3 fail_timeout=10s;
  keepalive 16;
}

upstream web_pool {
  zone web_pool 64k;
  server react-web:80 resolve max_fails=3 fail_timeout=10s;
  keepalive 16;
}

upstream dashboard_pool {
  zone dashboard_pool 64k;
  server dashboard:80 resolve max_fails=3 fail_timeout=10s;
  keepalive 16;
}

log_format agrismart '$remote_addr "$request" $status $body_bytes_sent rt=$request_time '
                     'upstream=$upstream_addr ust=$upstream_status urt=$upstream_response_time cache=$upstream_cache_status';

server {
  listen 8080;
  server_name _;
  access_log /var/log/nginx/access.log agrismart;
  include /etc/nginx/snippets/agrismart-routes.inc;

  location / {
    proxy_pass http://web_pool;
  }
}

server {
  listen 8090;
  server_name _;
  access_log /var/log/nginx/access.log agrismart;
  include /etc/nginx/snippets/agrismart-routes.inc;

  # Crop photos live once, in the React app; the dashboard shares them.
  location /images/ {
    proxy_pass http://web_pool;
  }

  location / {
    proxy_pass http://dashboard_pool;
  }
}

