# Full React + FastAPI/AIML + Express + Mongo stack.
# Local development: docker compose up --build
# React: http://localhost:8080 · FastAPI docs: http://localhost:8000/docs
name: agrismart

services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/python-fastapi/Dockerfile
    environment:
      ENVIRONMENT: development
      DATABASE_URL: sqlite:////data/agrioptima.db
      AUTO_CREATE_TABLES: "true"
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:8080
      MODEL_PATH: /app/AIML/models/crop_model.joblib
      METRICS_PATH: /app/AIML/models/metrics.json
      ASSISTANT_LLM: ${ASSISTANT_LLM:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - api-data:/data
      - ./AIML/models:/app/AIML/models:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  farm-service:
    build:
      context: backend/node-express
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4100
      MONGODB_URI: mongodb://mongo:27017/agrioptima?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:8080
      AGRI_API_URL: http://api:8000/api
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "4100:4100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  react-web:
    build:
      context: frontend/react-app
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
      farm-service:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  mongo-data:
  api-data:
