# AgriSmart full stack behind one load-balancing gateway.
#
#   docker compose up --build
#
#   React web app        http://localhost:8080
#   Operations dashboard http://localhost:8090
#   FastAPI docs         http://localhost:8080/docs
#   MCP (streamable HTTP) http://localhost:8080/mcp
#
# Scale any stateless tier on the fly; the gateway re-resolves replicas every 10 s:
#   docker compose up -d --scale api=5 --scale mcp=3 --scale farm-service=3
name: agrismart

x-api-env: &api-env
  ENVIRONMENT: development
  DATABASE_URL: postgresql+psycopg://agri:${POSTGRES_PASSWORD:-agri}@postgres:5432/agrioptima
  AUTO_CREATE_TABLES: "false" # the `migrate` job runs Alembic once, before any replica starts
  JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
  CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5175,http://localhost:5180,http://localhost:8080,http://localhost:8090
  REDIS_URL: redis://redis:6379/0
  MODEL_PATH: /app/AIML/models/crop_model.joblib
  METRICS_PATH: /app/AIML/models/metrics.json
  ASSISTANT_LLM: ${ASSISTANT_LLM:-auto}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  FARM_SERVICE_URL: http://farm-service:4100
  MCP_URL: http://mcp:8100
  MAX_CONCURRENCY: ${API_MAX_CONCURRENCY:-64}
  WEB_CONCURRENCY: ${API_WORKERS:-2}

x-api-build: &api-build
  context: .
  dockerfile: backend/python-fastapi/Dockerfile

services:
  # ------------------------------------------------------------- data stores
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agri}
      POSTGRES_DB: agrioptima
    command: ["postgres", "-c", "max_connections=300"]
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agri -d agrioptima"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ------------------------------------------------------------- Python / AIML
  migrate:
    build: *api-build
    image: agrismart-api:local
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    image: agrismart-api:local
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      replicas: ${API_REPLICAS:-3}
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  worker:
    build: *api-build
    image: agrismart-api:local
    environment: *api-env
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    healthcheck:
      disable: true # the image's HTTP healthcheck is for the API; the worker serves no HTTP
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    build: *api-build
    image: agrismart-api:local
    environment:
      PYTHONPATH: /app
      MCP_WORKERS: ${MCP_WORKERS:-2}
    command: ["python", "-m", "AIML.agentic_ai.mcp_server", "--transport", "http", "--host", "0.0.0.0", "--port", "8100"]
    deploy:
      replicas: ${MCP_REPLICAS:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ------------------------------------------------------------- Node
  farm-service:
    build:
      context: backend/node-express
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4100
      MONGODB_URI: mongodb://mongo:27017/agrioptima?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5175,http://localhost:5180,http://localhost:8080,http://localhost:8090
      AGRI_API_URL: http://api:8000/api
      REDIS_URL: redis://redis:6379/1
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      replicas: ${FARM_REPLICAS:-2}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ------------------------------------------------------------- frontends
  react-web:
    build:
      context: frontend/react-app
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
      farm-service:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: Dashboard
      dockerfile: Dockerfile
    restart: unless-stopped

  # ------------------------------------------------------------- gateway
  gateway:
    image: nginx:1.28-alpine # 1.27.3+ is required for `resolve` in upstream blocks
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/agrismart-routes.inc:/etc/nginx/snippets/agrismart-routes.inc:ro
    ports:
      - "8080:8080"
      - "8090:8090"
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
      farm-service:
        condition: service_healthy
      react-web:
        condition: service_started
      dashboard:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/gateway/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  mongo-data:
  pg-data:
  redis-data:
