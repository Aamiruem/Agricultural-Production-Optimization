# Full stack on one machine:
#   cp .env.example .env      # set JWT_SECRET (and ANTHROPIC_API_KEY for the AI assistant)
#   docker compose up --build
#   open http://localhost
# Train the ML model (writes ml/models/ and logs to MLflow, UI at http://localhost:5000):
#   docker compose --profile train run --rm trainer

name: agrioptima

x-api-env: &api-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+psycopg://agri:${POSTGRES_PASSWORD:-agri}@postgres:5432/agrioptima
  AUTO_CREATE_TABLES: "false" # migrations run on start (alembic upgrade head)
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ random characters)}
  CORS_ORIGINS: http://localhost
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  MLFLOW_TRACKING_URI: http://mlflow:5000

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agri}
      POSTGRES_DB: agrioptima
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agri -d agrioptima"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:8.0
    # Single-node replica set so the farm-service can use multi-document transactions.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    volumes: [qdrant-data:/qdrant/storage]

  mlflow:
    build: infra/mlflow
    ports: ["5000:5000"]
    volumes: [mlflow-data:/mlflow]

  api:
    build: { context: ., dockerfile: backend/Dockerfile, target: api }
    environment: *api-env
    volumes: [./ml/models:/app/ml/models] # serve the model trained by `trainer`
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }

  worker:
    build: { context: ., dockerfile: backend/Dockerfile, target: worker }
    environment: *api-env
    volumes: [./ml/models:/app/ml/models]
    depends_on:
      api: { condition: service_healthy } # api applies migrations first

  trainer:
    profiles: [train]
    build: { context: ., dockerfile: backend/Dockerfile, target: worker }
    working_dir: /app
    environment: { MLFLOW_TRACKING_URI: "http://mlflow:5000" }
    volumes: [./ml/models:/app/ml/models, ./ml/datasets:/app/ml/datasets, ./ml/reports:/app/ml/reports]
    command: ["sh", "-c", "python -m ml.data.download_dataset && python -m ml.train && python -m ml.explain"]
    depends_on: [mlflow]

  farm-service:
    build: services/farm-service
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/agrioptima?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: http://localhost
      AGRI_API_URL: http://api:8000/api
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      mongo: { condition: service_healthy }

  web:
    build:
      context: frontend/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost/api
        NEXT_PUBLIC_FARM_API_URL: http://localhost/farm-api
        NEXT_PUBLIC_FARM_SOCKET_URL: http://localhost
        NEXT_PUBLIC_SITE_URL: http://localhost
    environment:
      API_URL: http://api:8000/api # server components call the API inside the network
    depends_on: [api, farm-service]

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: [./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [web, api, farm-service]

volumes:
  postgres-data:
  mongo-data:
  qdrant-data:
  mlflow-data:
